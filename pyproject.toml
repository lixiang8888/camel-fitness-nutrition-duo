[project]
name = "camel-fitness-nutrition-duo"
version = "0.1.0"
description = "用 CAMEL 双智能体角色扮演，产出面向健身人群的饮食实战手册"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "camel-ai==0.2.90",
    # camel-ai 只声明了 mcp>=1.3.0，没有上界。mcp 2.x 移除了 mcp.server.FastMCP，
    # 装上新版后 import camel 会直接 ImportError。这里必须锁 <2。
    "mcp>=1.3.0,<2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
fitness-duo = "fitness_duo.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_duo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# launcher.py / make_shortcut.py 在项目根，不是被安装的包（只有 src/fitness_duo 是），
# 所以测试要 import 它们，得把根目录自己加进 sys.path。
pythonpath = ["."]
